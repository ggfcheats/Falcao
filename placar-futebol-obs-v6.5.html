<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar de Futebol para OBS - V6.2</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #00b140; /* Verde Chroma Key padrão */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px;
            overflow: hidden;
            transition: background 0.3s;
        }

        /* Classes para alternar fundo no OBS/Preview */
        body.transparent { background-color: transparent !important; }
        body.chroma { background-color: #00b140; }
        body.blue-preview { background-color: #5ea8f4; }

        /* --- CONFIGURAÇÕES DE LAYOUT DE TELA --- */
        .screen-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- LADO ESQUERDO: PLACAR EXIBIDO --- */
        .scoreboard-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
            padding-bottom: 60px; /* Espaço fixo reservado para o cartão não empurrar nada abaixo */
        }

        /* Animação Suave de Ocultar/Exibir o Placar */
        .scoreboard-wrapper.hidden {
            opacity: 0;
            transform: scale(0.8) translateY(-30px);
            pointer-events: none;
        }

        .score-relative-container {
            position: relative;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .main-score {
            background: #ffffff; 
            padding: 10px 30px;
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 28px;
            color: #1a202c;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .team-display {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 120px;
            transition: opacity 0.3s ease;
        }

        .team-left { justify-content: flex-end; text-align: right; }
        .team-right { justify-content: flex-start; text-align: left; }

        .team-name {
            text-transform: uppercase;
            font-size: 26px;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .score-number {
            font-size: 36px;
            font-weight: 800;
            margin: 0 10px;
            transition: color 0.2s ease;
        }

        /* ÍCONE DE BOLA DE FUTEBOL REALISTA */
        .center-ball {
            background: #0f1d3a;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 15px;
            z-index: 2;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.4), 0 2px 5px rgba(0,0,0,0.2);
        }

        .center-ball svg {
            width: 44px;
            height: 44px;
            fill: #ffffff;
            filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.3));
        }

        /* CONTEINER DE BADGES INFERIORES */
        .badges-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: -5px;
            z-index: 1;
            width: 100%;
        }

        .time-badge {
            background: #e2e8f0;
            color: #1a202c;
            padding: 4px 18px;
            border-radius: 0 0 15px 15px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .extra-info-badge {
            background: #0f1d3a;
            color: white;
            padding: 4px 18px;
            border-radius: 0 0 15px 15px;
            font-size: 14px;
            font-weight: 600;
