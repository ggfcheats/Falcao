<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel do Placar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Montserrat', sans-serif;
}

body{
    background:#111;
    color:white;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:#1d1d1d;
    padding:20px;
    border-radius:16px;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2a2a2a;
    color:white;
}

button{
    border:none;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.row{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.row button{
    flex:1;
}

.green{
    background:#00c853;
    color:white;
}

.red{
    background:#d50000;
    color:white;
}

.blue{
    background:#2962ff;
    color:white;
}

.yellowBtn{
    background:#ffd600;
    color:black;
}

.modeBox{
    margin-top:20px;
    padding:15px;
    background:#2a2a2a;
    border-radius:12px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.switch {
    position: relative;
    display: inline-block;
    width: 60px;
    height: 34px;
}

.switch input {
    opacity: 0;
}

.slider {
    position: absolute;
    inset: 0;
    background:#555;
    border-radius:34px;
    transition:.3s;
}

.slider:before {
    content:"";
    position:absolute;
    width:26px;
    height:26px;
    left:4px;
    bottom:4px;
    background:white;
    border-radius:50%;
    transition:.3s;
}

.switch input:checked + .slider{
    background:#00c853;
}

.switch input:checked + .slider:before{
    transform:translateX(26px);
}

</style>
</head>
<body>

<h1>⚽ Painel do Placar</h1>

<div class="grid">

<div class="card">

<h2>Times</h2>

<label>Time Casa</label>
<input id="homeName" value="FLAMENGO">

<label>Time Fora</label>
<input id="awayName" value="VASCO">

<label>Cor Casa</label>
<input type="color" id="homeColor" value="#d50000">

<label>Cor Fora</label>
<input type="color" id="awayColor" value="#000000">

<label>Logo Casa (URL)</label>
<input id="homeLogo">

<label>Upload Logo Casa</label>
<input type="file" id="homeLogoFile">

<label>Logo Fora (URL)</label>
<input id="awayLogo">

<label>Upload Logo Fora</label>
<input type="file" id="awayLogoFile">

<div class="modeBox">

<div>
<strong>Modo Completo</strong><br>
<small style="opacity:.7;">
Logo + nome completo
</small>
</div>

<label class="switch">
<input type="checkbox" id="fullMode">
<span class="slider"></span>
</label>

</div>

</div>

<div class="card">

<h2>Placar</h2>

<div class="row">
<button class="green" onclick="changeScore('home',1)">+ Casa</button>
<button class="red" onclick="changeScore('home',-1)">- Casa</button>
</div>

<div class="row">
<button class="green" onclick="changeScore('away',1)">+ Fora</button>
<button class="red" onclick="changeScore('away',-1)">- Fora</button>
</div>

<label>Competição</label>
<input id="competition" value="CAMPEONATO">

<label>Tempo</label>
<input id="time" value="00:00">

<div class="row">
<button class="green" onclick="startTimer()">▶</button>
<button class="yellowBtn" onclick="pauseTimer()">⏸</button>
<button class="red" onclick="resetTimer()">⏹</button>
</div>

<h3 style="margin-top:20px;">Acréscimos</h3>

<div class="row">
<button class="blue" onclick="addExtra(1)">+1</button>
<button class="blue" onclick="addExtra(2)">+2</button>
<button class="blue" onclick="addExtra(5)">+5</button>
<button class="red" onclick="clearExtra()">Limpar</button>
</div>

<label>🟨 Casa</label>
<input type="number" id="yellowHome" value="0">

<label>🟥 Casa</label>
<input type="number" id="redHome" value="0">

<label>🟨 Fora</label>
<input type="number" id="yellowAway" value="0">

<label>🟥 Fora</label>
<input type="number" id="redAway" value="0">

</div>

</div>

<script>

let timerInterval = null;
let seconds = 0;
let extraMinutes = 0;

let data = JSON.parse(localStorage.getItem("scoreboardData")) || {

    homeName:"FLAMENGO",
    awayName:"VASCO",

    homeShort:"FLA",
    awayShort:"VAS",

    homeColor:"#d50000",
    awayColor:"#000000",

    homeLogo:"",
    awayLogo:"",

    fullMode:false,

    homeScore:0,
    awayScore:0,

    competition:"CAMPEONATO",

    time:"00:00",

    yellowHome:0,
    redHome:0,

    yellowAway:0,
    redAway:0
};

loadInputs();

document.querySelectorAll("input").forEach(el=>{
    el.addEventListener("input", saveData);
});

document.getElementById("homeLogoFile").addEventListener("change", e=>{

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = ev=>{

        data.homeLogo = ev.target.result;

        saveData();
    }

    reader.readAsDataURL(file);
});

document.getElementById("awayLogoFile").addEventListener("change", e=>{

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = ev=>{

        data.awayLogo = ev.target.result;

        saveData();
    }

    reader.readAsDataURL(file);
});

function loadInputs(){

    homeName.value = data.homeName;
    awayName.value = data.awayName;

    homeColor.value = data.homeColor;
    awayColor.value = data.awayColor;

    homeLogo.value = data.homeLogo;
    awayLogo.value = data.awayLogo;

    competition.value = data.competition;

    time.value = data.time;

    yellowHome.value = data.yellowHome;
    redHome.value = data.redHome;

    yellowAway.value = data.yellowAway;
    redAway.value = data.redAway;

    fullMode.checked = data.fullMode;
}

function saveData(){

    data.homeName = homeName.value;
    data.awayName = awayName.value;

    data.homeShort = data.homeName.substring(0,3).toUpperCase();
    data.awayShort = data.awayName.substring(0,3).toUpperCase();

    data.homeColor = homeColor.value;
    data.awayColor = awayColor.value;

    data.homeLogo = homeLogo.value || data.homeLogo;
    data.awayLogo = awayLogo.value || data.awayLogo;

    data.fullMode = fullMode.checked;

    data.competition = competition.value;

    data.time = time.value;

    data.yellowHome = yellowHome.value;
    data.redHome = redHome.value;

    data.yellowAway = yellowAway.value;
    data.redAway = redAway.value;

    localStorage.setItem("scoreboardData", JSON.stringify(data));
}

function changeScore(team,value){

    if(team === "home"){
        data.homeScore += value;
        if(data.homeScore < 0) data.homeScore = 0;
    }

    if(team === "away"){
        data.awayScore += value;
        if(data.awayScore < 0) data.awayScore = 0;
    }

    saveData();
}

function formatTime(sec){

    let min = Math.floor(sec / 60);
    let s = sec % 60;

    min = String(min).padStart(2,"0");
    s = String(s).padStart(2,"0");

    return min + ":" + s;
}

function updateDisplayTime(){

    let base = formatTime(seconds);

    if(extraMinutes > 0){
        data.time = base + " +" + extraMinutes;
    }else{
        data.time = base;
    }

    time.value = data.time;

    saveData();
}

function updateTimer(){

    seconds++;

    updateDisplayTime();
}

function startTimer(){

    if(timerInterval) return;

    timerInterval = setInterval(updateTimer,1000);
}

function pauseTimer(){

    clearInterval(timerInterval);

    timerInterval = null;
}

function resetTimer(){

    pauseTimer();

    seconds = 0;
    extraMinutes = 0;

    data.time = "00:00";

    time.value = "00:00";

    saveData();
}

function addExtra(min){

    extraMinutes += min;

    updateDisplayTime();
}

function clearExtra(){

    extraMinutes = 0;

    updateDisplayTime();
}

</script>

</body>
</html>
