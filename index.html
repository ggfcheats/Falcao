<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar Profissional - OBS Broadcast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Montserrat:wght@500;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sports': ['Montserrat', 'sans-serif'],
                        'clock': ['Teko', 'sans-serif'],
                        'impact': ['Bebas Neue', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Fundo transparente essencial para o OBS */
        body { background-color: transparent !important; margin: 0; overflow: hidden; }
        
        /* Containers Principais */
        .scoreboard-wrapper {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        /* --- LAYOUT HORIZONTAL --- */
        .layout-horizontal { display: flex; align-items: stretch; height: 54px; }
        .h-team-block { display: flex; align-items: center; padding: 0 16px; position: relative; min-width: 180px; }
        .h-score-block {
            background: #0a0a0a; color: white; font-family: 'Teko', sans-serif; font-size: 40px;
            font-weight: 600; padding: 0 15px; display: flex; align-items: center; justify-content: center;
            min-width: 50px; line-height: 1; border-left: 1px solid #333; border-right: 1px solid #333;
        }
        .h-timer-block { display: flex; align-items: center; padding: 0 16px; font-family: 'Teko', sans-serif; color: white; position: relative; }
        
        /* --- LAYOUT VERTICAL (LATERAL) --- */
        .layout-vertical { display: flex; flex-direction: column; width: 240px; }
        .v-team-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .v-score-box { background: #0a0a0a; color: white; font-family: 'Teko', sans-serif; font-size: 36px; padding: 0 12px; border-radius: 6px; line-height: 1.1; font-weight: 600; }
        .v-timer-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px; font-family: 'Teko', sans-serif; color: white; background: rgba(0,0,0,0.4); }

        /* Estilos Comuns de Texto e Logo */
        .team-logo { width: 32px; height: 32px; object-fit: contain; margin: 0 10px; drop-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .team-name { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 22px; color: white; letter-spacing: 1px; text-transform: uppercase; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        
        .period-text { font-size: 20px; font-weight: 600; letter-spacing: 1px; opacity: 0.9; margin-top: 2px; }
        .clock-text { font-size: 38px; font-weight: 600; line-height: 1; min-width: 65px; text-align: center; }
        .stoppage-text { font-size: 26px; font-weight: 600; margin-left: 8px; color: #ffeb3b; text-shadow: 0 0 5px rgba(255, 235, 59, 0.5); }

        /* Cartões */
        .cards-container { display: flex; gap: 3px; }
        .h-cards-a { position: absolute; bottom: 4px; right: 16px; }
        .h-cards-b { position: absolute; bottom: 4px; left: 16px; }
        .card-indicator { width: 8px; height: 12px; border-radius: 1px; box-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .card-yellow { background-color: #facc15; }
        .card-red { background-color: #ef4444; }

        /* Temas */
        .theme-dark .h-team-block, .theme-dark .v-team-row { background: linear-gradient(to bottom, #2d3748, #1a202c); }
        .theme-dark .h-timer-block { background: linear-gradient(to bottom, #4a5568, #2d3748); }
        
        .theme-light .h-team-block, .theme-light .v-team-row { background: linear-gradient(to bottom, #f7fafc, #cbd5e1); }
        .theme-light .team-name { color: #0f172a; text-shadow: none; }
        .theme-light .h-timer-block { background: linear-gradient(to bottom, #334155, #0f172a); }
        
        .theme-green .h-team-block, .theme-green .v-team-row { background: linear-gradient(to bottom, #166534, #14532d); }
        .theme-green .h-timer-block { background: linear-gradient(to bottom, #1e293b, #0f172a); }
        
        .theme-blue .h-team-block, .theme-blue .v-team-row { background: linear-gradient(to bottom, #1e3a8a, #172554); }
        .theme-blue .h-timer-block { background: linear-gradient(to bottom, #b91c1c, #7f1d1d); }

        /* Painel de Controle (Oculto na transmissão normal) */
        #control-panel {
            transition: transform 0.3s ease-in-out;
            max-height: 45vh; /* Garante que não cubra a metade superior da tela */
            overflow-y: auto;
        }
        .hidden-controls { transform: translateY(120%); }

        /* --- ANIMAÇÃO DE GOL INTERNA --- */
        .goal-overlay-inner {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Impact', sans-serif;
            color: white;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }
        
        .layout-horizontal .goal-overlay-inner { flex-direction: row; font-size: 38px; gap: 15px; }
        .layout-vertical .goal-overlay-inner { flex-direction: column; font-size: 42px; gap: 0px; line-height: 1; }

        .animate-inner-goal {
            animation: flashGoalInner 4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes flashGoalInner {
            0% { opacity: 0; transform: scale(0.98); }
            10% { opacity: 1; transform: scale(1); }
            15% { opacity: 0.8; transform: scale(1.02); }
            20% { opacity: 1; transform: scale(1); }
            25% { opacity: 0.8; transform: scale(1.02); }
            30% { opacity: 1; transform: scale(1); }
            85% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.98); }
        }

        .goal-text-pulse { animation: textPulse 0.5s infinite alternate; font-style: italic; letter-spacing: 2px;}
        @keyframes textPulse { from { text-shadow: 0 0 10px rgba(255,255,255,0.5); } to { text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.8); transform: scale(1.05); } }

        /* Scrollbar Personalizada para o Painel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="text-white relative w-screen h-screen">

    <!-- PLACAR PRINCIPAL (Visível no OBS) -->
    <div id="broadcast-layer" class="absolute top-8 left-12 z-10 transition-all duration-500">
        
        <!-- WRAPPER DO PLACAR -->
        <div id="scoreboard-wrapper" class="scoreboard-wrapper theme-dark layout-horizontal">
            
            <!-- OVERLAY DE GOL (Interno ao Placar) -->
            <div id="goal-banner" class="goal-overlay-inner hidden">
                <span class="goal-text-pulse text-yellow-300">GOOOOOL</span>
                <span id="goal-banner-team" class="drop-shadow-lg font-sports font-black">TIME</span>
            </div>

            <!-- ===== LAYOUT 1: HORIZONTAL ===== -->
            <div id="layout-h-content" class="contents">
                <div class="h-team-block justify-end" style="border-radius: 8px 0 0 8px;">
                    <div class="cards-container h-cards-a" id="h-cards-a"></div>
                    <span class="team-name" id="h-name-a">FLA</span>
                    <img id="h-logo-a" src="" alt="Logo A" class="team-logo">
                </div>

                <div class="h-score-block">
                    <span id="h-pen-a" class="text-xl text-yellow-500 mr-2 hidden">(0)</span>
                    <span id="h-score-a" class="mx-1 text-4xl">0</span>
                    <span class="text-gray-500 text-2xl mx-1 -mt-1">-</span>
                    <span id="h-score-b" class="mx-1 text-4xl">0</span>
                    <span id="h-pen-b" class="text-xl text-yellow-500 ml-2 hidden">(0)</span>
                </div>

                <div class="h-team-block justify-start">
                    <div class="cards-container h-cards-b" id="h-cards-b"></div>
                    <img id="h-logo-b" src="" alt="Logo B" class="team-logo">
                    <span class="team-name" id="h-name-b">FLU</span>
                </div>

                <div class="h-timer-block" style="border-radius: 0 8px 8px 0;">
                    <span id="h-period" class="period-text mr-3">1ºT</span>
                    <span id="h-clock" class="clock-text">00:00</span>
                    <span id="h-stoppage" class="stoppage-text hidden">+0</span>
                </div>
            </div>

            <!-- ===== LAYOUT 2: VERTICAL (Oculto por padrão) ===== -->
            <div id="layout-v-content" class="hidden w-full h-full flex flex-col">
                <!-- Time A -->
                <div class="v-team-row">
                    <div class="flex items-center">
                        <img id="v-logo-a" src="" alt="Logo A" class="team-logo !ml-0 !mr-3">
                        <div class="flex flex-col">
                            <span class="team-name text-xl leading-none" id="v-name-a">FLA</span>
                            <div class="cards-container mt-1" id="v-cards-a"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="v-pen-a" class="text-lg text-yellow-500 font-clock font-bold hidden">(0)</span>
                        <div class="v-score-box" id="v-score-a">0</div>
                    </div>
                </div>
                
                <!-- Time B -->
                <div class="v-team-row">
                    <div class="flex items-center">
                        <img id="v-logo-b" src="" alt="Logo B" class="team-logo !ml-0 !mr-3">
                        <div class="flex flex-col">
                            <span class="team-name text-xl leading-none" id="v-name-b">FLU</span>
                            <div class="cards-container mt-1" id="v-cards-b"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="v-pen-b" class="text-lg text-yellow-500 font-clock font-bold hidden">(0)</span>
                        <div class="v-score-box" id="v-score-b">0</div>
                    </div>
                </div>

                <!-- Tempo -->
                <div class="v-timer-row">
                    <span id="v-period" class="period-text text-gray-300">1ºT</span>
                    <div class="flex items-center">
                        <span id="v-clock" class="clock-text">00:00</span>
                        <span id="v-stoppage" class="stoppage-text hidden">+0</span>
                    </div>
                </div>
            </div>

        </div>
        
        <!-- Notificação de Substituição -->
        <div id="sub-notification" class="absolute left-0 mt-2 bg-gradient-to-r from-blue-700 to-blue-900 text-white px-4 py-1 rounded shadow-lg font-sports font-bold text-sm flex items-center opacity-0 transition-opacity duration-500">
            <i class="fa-solid fa-arrows-rotate mr-2"></i> SUBSTITUIÇÃO
        </div>
    </div>

    <!-- BOTÃO FLUTUANTE PARA MOSTRAR CONTROLES -->
    <button id="show-controls-btn" onclick="toggleControls()" class="fixed bottom-4 right-4 z-30 bg-gray-800/80 hover:bg-gray-700 text-white p-3 rounded-full shadow-lg backdrop-blur transition-all hidden border border-gray-600" title="Mostrar Painel (Tecla H)">
        <i class="fa-solid fa-gamepad"></i>
    </button>

    <!-- PAINEL DE CONTROLE (Fixo na Base, Altura Máxima Controlada) -->
    <div id="control-panel" class="fixed bottom-0 left-0 w-full bg-gray-900/95 backdrop-blur-md border-t border-gray-700 p-4 z-20 shadow-[0_-10px_40px_rgba(0,0,0,0.7)]">
        
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                <h2 class="text-xl font-bold font-sports text-yellow-400"><i class="fa-solid fa-sliders mr-2"></i> Controle de Transmissão</h2>
                <div class="flex gap-4">
                    <button onclick="resetAll()" class="text-sm bg-red-900 hover:bg-red-800 px-3 py-1 rounded text-white transition border border-red-700"><i class="fa-solid fa-trash mr-1"></i> Resetar Tudo</button>
                    <button onclick="toggleControls()" class="text-sm bg-gray-700 hover:bg-gray-600 px-4 py-1 rounded text-white transition flex items-center border border-gray-500"><i class="fa-regular fa-eye-slash mr-2"></i> Esconder Painel (H)</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- CONTROLE TIME MANDANTE -->
                <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-inner">
                    <div class="flex justify-between items-center mb-3 border-b border-gray-700 pb-1">
                        <h3 class="font-bold text-lg">Mandante</h3>
                        <input type="color" id="color-a" value="#ef4444" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0" onchange="updateState()" title="Cor do time (usado no gol)">
                    </div>
                    
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="input-name-a" placeholder="Sigla" maxlength="4" class="w-full bg-gray-700 text-white rounded px-2 py-1 uppercase text-center font-bold" oninput="updateState()">
                        <label class="bg-gray-700 hover:bg-gray-600 cursor-pointer px-3 py-1 rounded flex items-center justify-center transition border border-gray-600" title="Upload Escudo">
                            <i class="fa-solid fa-upload"></i>
                            <input type="file" accept="image/*" class="hidden" onchange="uploadLogo(event, 'a')">
                        </label>
                    </div>

                    <div class="flex justify-between items-center bg-gray-900 p-2 rounded mb-3 border border-gray-700">
                        <button onclick="changeScore('a', -1)" class="w-8 h-8 bg-gray-700 hover:bg-gray-600 rounded font-bold">-</button>
                        <div class="text-center">
                            <span class="text-xs text-gray-400 block font-bold">GOLS</span>
                            <span id="ctrl-score-a" class="text-3xl font-bold font-clock text-white">0</span>
                        </div>
                        <button onclick="changeScore('a', 1)" class="w-8 h-8 bg-green-700 hover:bg-green-600 rounded font-bold">+</button>
                    </div>

                    <button onclick="triggerGoal('a')" id="btn-goal-a" class="w-full bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-2 rounded mb-3 uppercase tracking-wider transition shadow-lg"><i class="fa-solid fa-futbol mr-2"></i> Gol Mandante (1)</button>

                    <div class="flex justify-between gap-2 mb-3">
                        <button onclick="addCard('a', 'yellow')" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-black py-1 rounded text-sm font-bold shadow">+ Amarelo</button>
                        <button onclick="addCard('a', 'red')" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-1 rounded text-sm font-bold shadow">+ Vermelho</button>
                        <button onclick="clearCards('a')" class="px-2 bg-gray-700 hover:bg-gray-600 rounded text-sm border border-gray-600" title="Limpar Cartões"><i class="fa-solid fa-eraser"></i></button>
                    </div>

                    <div class="penalties-ctrl hidden bg-gray-900 p-2 rounded border border-gray-700">
                        <span class="text-xs text-gray-400 block text-center mb-1 font-bold">PÊNALTIS</span>
                        <div class="flex justify-center items-center gap-4">
                            <button onclick="changePenalty('a', -1)" class="w-6 h-6 bg-gray-700 rounded hover:bg-gray-600">-</button>
                            <span id="ctrl-pen-a" class="text-xl font-bold font-clock text-yellow-400">0</span>
                            <button onclick="changePenalty('a', 1)" class="w-6 h-6 bg-gray-700 rounded hover:bg-gray-600">+</button>
                        </div>
                    </div>
                </div>

                <!-- CONTROLE TEMPO E LAYOUT -->
                <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 shadow-inner flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-lg mb-3 text-center border-b border-gray-700 pb-1">Cronômetro & Opções</h3>
                        
                        <div class="flex justify-center items-center gap-2 mb-4">
                            <button onclick="adjustTime(-60)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs border border-gray-600">-1m</button>
                            <button onclick="adjustTime(-10)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs border border-gray-600">-10s</button>
                            <span id="ctrl-clock" class="text-4xl font-clock font-bold mx-2 text-white">00:00</span>
                            <button onclick="adjustTime(10)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs border border-gray-600">+10s</button>
                            <button onclick="adjustTime(60)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs border border-gray-600">+1m</button>
                        </div>

                        <div class="flex gap-2 mb-4">
                            <button id="btn-play" onclick="toggleTimer()" class="flex-1 bg-green-600 hover:bg-green-500 py-2 rounded font-bold transition shadow-lg"><i class="fa-solid fa-play mr-2"></i> Iniciar (Espaço)</button>
                            <button onclick="resetTimer()" class="px-4 bg-red-700 hover:bg-red-600 rounded transition border border-red-600 shadow" title="Zerar Tempo"><i class="fa-solid fa-rotate-left"></i></button>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1 font-bold">Acréscimos</label>
                                <select id="input-stoppage" class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm outline-none text-white" onchange="updateState()">
                                    <option value="0">Nenhum</option>
                                    <option value="1">+1</option><option value="2">+2</option><option value="3">+3</option>
                                    <option value="4">+4</option><option value="5">+5</option><option value="6">+6</option>
                                    <option value="7">+7</option><option value="8">+8</option><option value="9">+9</option>
                                    <option value="10">+10</option><option value="15">+15</option>
